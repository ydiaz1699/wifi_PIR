# ============================================================================
# GUÍA RÁPIDA DE SETUP
# ============================================================================
setup_inicial:
  paso_1: "git clone <repo> && cd reloj-ntp-nodemcu"
  paso_2: "cp include/secrets.h.template include/secrets.h"
  paso_3: "Editar include/secrets.h: agregar WiFi SSID, password, zona horaria"
  paso_4: "platformio run --target upload"
  paso_5: "platformio device monitor --baud 115200"
  esperado: "LCD muestra 'Iniciando reloj' → 'Sincronizando hora (NTP)...' → HH:MM"

variables_entorno:
  DEBUG_LOG: "Definir en platformio.ini para activar logs (comentar para release)"
  WIFI_SSID: "En include/secrets.h (cadena_t)"
  WIFI_PASSWORD: "En include/secrets.h (cadena_t)"
  GMT_OFFSET_SEC: "En include/secrets.h (segundos. ej: 3600 para UTC+1)"
  DAYLIGHT_OFFSET_SEC: "En include/secrets.h (segundos DST)"
  NTP_SERVER: "En include/secrets.h (URL del servidor, ej: 'pool.ntp.org')"

# ============================================================================
# GUÍA DE DEPURACIÓN
# ============================================================================
debugging:
  puerto_serial: "COM3 a 115200 baud (ajustar según tu puerto USB)"
  habilitar_logs: "Descomentar #define DEBUG_LOG en platformio.ini"
  
  sintomas_comunes:
    display_muestra_basura:
      causa: "Slots CGRAM (0) usados incorrectamente"
      solucion: "Revisar display.h:drawDigit(), usar chars::BLANK"
    
    no_conecta_wifi:
      causa: "SSID/password incorrecto, WiFi fuera de rango"
      solucion: "Revisar secrets.h, revisar logs seriales"
    
    hora_no_sincroniza:
      causa: "WiFi no conectado, servidor NTP caído, puerto UDP 123 bloqueado"
      solucion: "Revisar WiFi, probar otro NTP server, revisar firewall"
    
    display_congelado:
      causa: "delay() en loop(), FSM bloqueada"
      solucion: "Revisar millis() vs delay(), usar timeline no bloqueante"
    
    compilacion_falla:
      causa: "secrets.h falta, C++20 features en código, memoria insuficiente"
      solucion: "Copiar secrets.h.template, revisar -std=c++17, reducir código"

