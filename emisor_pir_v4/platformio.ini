[env:emisor_pir_v4]
platform = espressif8266
board = d1_mini
framework = arduino
monitor_speed = 115200
build_flags =
    -I../
lib_extra_dirs =
    ../lib

[env:emisor_pir_v4_ota]
extends = env:emisor_pir_v4
upload_protocol = espota
upload_port = 192.168.0.200

; Export WIFI_PIR_OTA_PASSWORD locally before uploading; never commit it.
upload_flags =
    --auth=${sysenv.WIFI_PIR_OTA_PASSWORD}
    --host_ip=192.168.1.105
    --host_port=32260
